[package]
name = "embassy-usb-chipidea"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "`embassy-usb-driver` implementation for Chipidea USB device controllers"
keywords = ["embedded", "async", "usb", "hal", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std", "asynchronous"]
repository = "https://github.com/embassy-rs/embassy"
documentation = "https://docs.embassy.dev/embassy-usb-chipidea"

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-usb-chipidea-v$VERSION/embassy-usb-chipidea/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-usb-chipidea/src/"
features = ["defmt"]
target = "thumbv8m.main-none-eabihf"

[dependencies]
critical-section = "1.1"
portable-atomic = { version = "1" }

embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embassy-time = { version = "0.5.1", path = "../embassy-time" }
embassy-usb-driver = { version = "0.2.2", path = "../embassy-usb-driver" }

defmt = { version = "1.0.1", optional = true }
log = { version = "0.4.14", optional = true }

[features]
default = []
defmt = ["dep:defmt", "embassy-usb-driver/defmt"]
log = ["dep:log"]
