[target.thumbv8m.main-none-eabihf]
# No `--preverify`/`--verify`: probe-rs 0.32's read-back verification reports a
# spurious "Flash content verification failed" on MCXN947 whenever an
# invocation actually programs flash. Re-running immediately then succeeds,
# because preverify finds the content already matching and skips programming -
# so the write itself is fine and only the read-back comparison is wrong.
# With the flags set, every `cargo run` after a rebuild fails on its first try.
runner = 'probe-rs run --chip MCXN947 --protocol swd --speed 12000'

rustflags = [
  # `flip-link` (https://github.com/knurling-rs/flip-link) gives stack
  # overflow protection by placing the stack below `.bss`/`.data`.
  "-C", "linker=flip-link",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  # This is needed if your flash or ram addresses are not aligned to 0x10000 in memory.x
  # See https://github.com/rust-embedded/cortex-m-quickstart/pull/95
  "-C", "link-arg=--nmagic",
]

[build]
target = "thumbv8m.main-none-eabihf" # Cortex-M33

[env]
DEFMT_LOG = "trace"
