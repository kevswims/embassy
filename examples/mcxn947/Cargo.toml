[package]
name = "embassy-mcxn947-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["set-sp", "set-vtor"] }
critical-section = "1.2.0"
defmt = "1.0"
defmt-rtt = "1.0"
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
embassy-mcxn = { version = "0.1.0", path = "../../embassy-mcxn", features = ["defmt", "unstable-pac", "mcxn947"] }
embassy-net-driver = { version = "0.2.0", path = "../../embassy-net-driver" }
embassy-net = { version = "0.9.1", path = "../../embassy-net", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet", "dns"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt"] }
embassy-usb = { version = "0.6.0", path = "../../embassy-usb", features = ["defmt"] }
embedded-io-async = { version = "0.7.0" }
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

[profile.release]
lto = true # better optimizations
debug = 2  # enough information for defmt/rtt locations

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/mcxn947" }
]
