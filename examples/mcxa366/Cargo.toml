[package]
name = "embassy-mcxa366-examples"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", features = ["set-sp", "set-vtor"] }
crc = "3.4.0"
defmt = "1.0"
defmt-rtt = "1.0"
embassy-embedded-hal = { version = "0.6.0", path = "../../embassy-embedded-hal" }
embassy-executor = { version = "0.10.0", path = "../../embassy-executor", default-features = false, features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-futures = { version = "0.1.2", path = "../../embassy-futures" }
embassy-mcxa = { version = "0.1.0", path = "../../embassy-mcxa", features = ["defmt", "unstable-pac", "mcxa366"] }
embassy-time = { version = "0.5.1", path = "../../embassy-time", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-io-async = "0.7.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2.1.1"

[features]
time-driver-lptmr = ["embassy-mcxa/time-driver-lptmr"]

[profile.release]
lto = true
debug = 2

[package.metadata.embassy]
build = [
  { target = "thumbv8m.main-none-eabihf", artifact-dir = "out/examples/mcxa366" }
]
