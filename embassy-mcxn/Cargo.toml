[package]
name = "embassy-mcxn"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Embassy Hardware Abstraction Layer (HAL) for NXP MCXN series of MCUs"
repository = "https://github.com/embassy-rs/embassy"
keywords = ["embedded", "hal", "nxp", "mcxn", "embassy"]
categories = ["embedded", "hardware-support", "no-std"]
documentation = "https://docs.embassy.dev/embassy-mcxn"

publish = false

[package.metadata.embassy]
build = [
    {target = "thumbv8m.main-none-eabihf", features = ["defmt", "unstable-pac", "mcxn947"]},
]

[package.metadata.embassy_docs]
src_base = "https://github.com/embassy-rs/embassy/blob/embassy-mcxn-v$VERSION/embassy-mcxn/src/"
src_base_git = "https://github.com/embassy-rs/embassy/blob/$COMMIT/embassy-mcxn/src/"

features = ["defmt", "unstable-pac"]
flavors = [
    { name = "mcx-n947", target = "thumbv8m.main-none-eabihf", features = ["mcxn947"] },
]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core", "inline-asm"] }
# If you would like "device" to be an optional feature, please open an issue.
cortex-m-rt = { version = "0.7", features = ["device"] }
critical-section = "1.2.0"
defmt = { version = "1.0", optional = true }
embassy-embedded-hal = { version = "0.6.0", path = "../embassy-embedded-hal" }
embassy-futures = { version = "0.1.2", path = "../embassy-futures" }
embassy-hal-internal = { version = "0.5.0", path = "../embassy-hal-internal", features = ["cortex-m", "prio-bits-3"] }
xarxa-driver = { git = "https://github.com/embassy-rs/xarxa", rev = "93228f1ec64720122016be52be4671e413fa92a9", features = ["async"] }
heapless = "0.9.3"
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
embassy-usb-chipidea = { version = "0.1.0", path = "../embassy-usb-chipidea" }
embassy-usb-driver = { version = "0.2.2", path = "../embassy-usb-driver" }
embedded-hal-02 = { package = "embedded-hal", version = "0.2.6", features = ["unproven"] }
embedded-hal-1 = { package = "embedded-hal", version = "1.0" }
embedded-hal-async = { version = "1.0" }
embedded-hal-nb = { version = "1.0" }
embedded-io = "0.7"
embedded-io-async = { version = "0.7.0" }
embedded-storage = "0.3.1"
paste = "1.0.15"
vcell = "0.1.3"

# `time` dependencies
embassy-time = { version = "0.5.1", path = "../embassy-time" }
embassy-time-driver = { version = "0.2.2", path = "../embassy-time-driver", features = ["tick-hz-1_000_000"] }
embassy-time-queue-utils = { version = "0.3.2", path = "../embassy-time-queue-utils" }

# NOTE: pointed at a local checkout for now, since MCXN947 support in nxp-pac
# is under active development and not yet at a pinned upstream rev. Switch
# back to the `git`/`rev` form used by embassy-mcxa once that support lands.
nxp-pac = { path = "../../nxp-pac/nxp-pac", features = ["rt"] }

[build-dependencies]
nxp-pac = { path = "../../nxp-pac/nxp-pac", default-features = false, features = ["metadata"] }
proc-macro2 = "1.0.106"
quote = "1.0.45"
regex = "1.12.3"
syn = "2.0.117"
convert_case = "0.11"
indexmap = "2.14.0"

[features]
default = ["rt"]

# Base defmt feature enables core + panic handler
# Use with one logger feature: defmt-rtt (preferred) or defmt-uart (fallback)
defmt = ["dep:defmt", "nxp-pac/defmt", "xarxa-driver/defmt", "embassy-usb-chipidea/defmt"]

unstable-pac = []

## Enable Ethernet PTP (IEEE 1588) hardware timestamping.
ptp = ["xarxa-driver/packetmeta-timestamp"]

# dummy feature to silence embassy-hal-internal lint
rt = []

#
# Chip family selection
#
mcxn947 = ["nxp-pac/mcxn947_cm33_core0"]

[dev-dependencies]
embassy-executor = { version = "0.10.0", path = "../embassy-executor", features = ["platform-cortex-m", "executor-interrupt", "executor-thread"] }
panic-halt = "1.0.0"
static_cell = "2.1.1"
